steps:
  # Step 1: Build and push image with both :latest and commit SHA
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/senthilmsbk/myservice:latest',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/senthilmsbk/myservice:$COMMIT_SHA',
        '.'
      ]

  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$PROJECT_ID/senthilmsbk/myservice:latest'
      ]

  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'us-central1-docker.pkg.dev/$PROJECT_ID/senthilmsbk/myservice:$COMMIT_SHA'
      ]

  # Step 2: Ensure Cloud Run services exist (create if missing)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -e
        for svc in myservice-dev myservice-stage; do
          if ! gcloud run services describe $svc --region us-central1 --project $PROJECT_ID >/dev/null 2>&1; then
            echo "Creating Cloud Run service $svc..."
            gcloud run deploy $svc \
              --image=us-central1-docker.pkg.dev/$PROJECT_ID/senthilmsbk/myservice:latest \
              --region=us-central1 \
              --platform managed \
              --allow-unauthenticated
          else
            echo "Service $svc already exists."
          fi
        done

  # Step 3: Apply Cloud Deploy pipeline and targets
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: 'sh'
    args:
      - -xe
      - -c
      - |
        gcloud deploy apply --file=cloudtestpipeline.yml --region=us-central1
        gcloud deploy apply --file=cloudtesttarget.yml --region=us-central1

  # Step 4: Create a Cloud Deploy release using commit SHA
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: 'sh'
    args:
      - -xe
      - -c
      - |
        gcloud deploy releases create release-first-service-${COMMIT_SHA} \
          --delivery-pipeline=myservice-pipeline \
          --region=us-central1 \
          --images=myservice=us-central1-docker.pkg.dev/$PROJECT_ID/senthilmsbk/myservice:$COMMIT_SHA \
          --release-config=devrelease.yml
options:
  logging: CLOUD_LOGGING_ONLY