steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/senthilmsbk/cloudtest/pipe-firstsample:$COMMIT_SHA', '.']
  # Step 2: Deploy the newly built image to Cloud Run
  - name: 'gcr.io/://google.com'
    entrypoint: 'gcloud'
    args:
        - 'run'
        - 'deploy'
        - 'my-service'
        - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/springboot-app:$COMMIT_SHA'
        - '--region=us-central1'
        - '--allow-unauthenticated'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/senthilmsbk/cloudtest/pipe-firstsample:$COMMIT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
